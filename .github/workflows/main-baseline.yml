name: Verify / Main Baseline

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-baseline
  cancel-in-progress: false

jobs:
  integrity:
    name: Lightweight package integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Manifest + package integrity
        run: |
          npm run verify:manifest
          npm run verify:package
